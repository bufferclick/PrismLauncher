name: Build JL for Windows

# Builds JL.exe on a real Windows runner and attaches it to a GitHub Release.
#
# Triggers:
#   * push a tag like v0.0.1            -> builds and publishes a release
#   * "Run workflow" from the Actions   -> builds a portable zip artifact only
#
# No secrets or signing certificates are required: the portable build is a plain
# zip of the install tree, produced by tools/jlac/package-portable.ps1.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jl-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      BUILD_TYPE: Release
      CMAKE_PRESET: ci
      BUILD_PLATFORM: official
      ARTIFACT_NAME: Windows-MSVC

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.11.2

      - name: Cache vcpkg
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/cmake/vcpkg/installed
          key: jl-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: jl-vcpkg-${{ runner.os }}-

      - name: Verify the HorizonPort toolkit
        shell: pwsh
        run: |
          # The toolkit is what JL calls for every security-sensitive step:
          # verifying Horizon's signed checksums, unpacking a build, downloading
          # the owner's game files, preparing resources, validating a launch
          # command. If it is broken, the port is broken, so prove it on the
          # platform JL ships on. This runs before the build so a broken toolkit
          # is reported in a minute rather than after a full compile.
          python -m porting.horizonport --version
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the toolkit does not run"; exit 1 }
          python -m porting.horizonport doctor
          # doctor exits non-zero only on FAIL; a missing Java or Rust is a WARN
          # and is expected on a build machine.
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::horizonport doctor reported a failure"; exit 1 }
          # Out-String -Stream turns stderr into plain text; capturing 2>&1
          # directly leaves ErrorRecords that carry no per-line text.
          $out = & python -m unittest -v porting.tests.test_horizonport_sign porting.tests.test_horizonport_config `
                                       porting.tests.test_horizonport_fetch porting.tests.test_horizonport_mods `
                                       porting.tests.test_horizonport_launch porting.tests.test_horizonport_cli `
                                       porting.tests.test_horizonport_install porting.tests.test_horizonport_json 2>&1 |
                 Out-String -Stream
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            # Surface the failing cases and their assertion text in annotations;
            # the raw job log is not always retrievable.
            $inFailure = $false
            $shown = 0
            foreach ($line in $out) {
              if ($line -match '^(FAIL|ERROR): ') {
                $inFailure = $true
                Write-Host "::error::$line"
                continue
              }
              if ($line -match '^-{10,}$' -or $line -match '^=+$' -or $line -match '^Ran \d+ tests?') {
                $inFailure = $false
                continue
              }
              if ($inFailure -and $shown -lt 60 -and $line.Trim()) {
                Write-Host "::error::  $line"
                $shown++
              }
            }
            Write-Host "::error::the toolkit's self-tests failed"
            exit 1
          }

      - name: Configure
        run: cmake --preset "$env:CMAKE_PRESET" -D VCPKG_HOST_TRIPLET=x64-windows -D VCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset "$env:CMAKE_PRESET" --config Release 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Show build errors
        if: failure()
        shell: pwsh
        run: |
          $lines = Get-Content build.log -ErrorAction SilentlyContinue
          if (-not $lines) { Write-Host "::error::build.log missing"; exit 0 }
          $idx = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match "error C|error LNK|FAILED:" }
          $n = 0
          foreach ($i in ($idx | Select-Object -First 8)) {
            $chunk = ($lines[$i..([Math]::Min($i + 2, $lines.Count - 1))] -join " / ")
            if ($chunk.Length -gt 900) { $chunk = $chunk.Substring(0, 900) }
            Write-Host "::error::$chunk"
            $n++
          }
          if ($n -eq 0) {
            $tail = ($lines | Select-Object -Last 12) -join " / "
            if ($tail.Length -gt 900) { $tail = $tail.Substring(0, 900) }
            Write-Host "::error::no compiler error found; tail: $tail"
          }

      - name: Collect portable build
        shell: pwsh
        run: pwsh -NoProfile -File tools/jlac/package-portable.ps1

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "out/JL.exe")) { Write-Host "::error::JL.exe missing"; exit 1 }
          if (-not (Test-Path "out/JL-Windows-x64.zip")) { Write-Host "::error::portable zip missing"; exit 1 }
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "out/JL-Windows-x64.zip"))
          try {
            $toolkit = $zip.Entries | Where-Object { $_.FullName -eq "porting/horizonport/cli.py" }
            if (-not $toolkit) { Write-Host "::error::the portable zip does not contain porting/horizonport"; exit 1 }
            Write-Host "zip entries: $($zip.Entries.Count)"
          } finally { $zip.Dispose() }

          # A file being present proves nothing: it has to *run*, from the layout
          # the launcher ships, with the same import path the launcher sets. The
          # previous check only looked for the file, so a build went out in which
          # every Horizon command failed with "No module named 'porting'".
          Expand-Archive -Path "out/JL-Windows-x64.zip" -DestinationPath "out/unpacked" -Force
          Push-Location "out/unpacked"
          try {
            $env:PYTHONPATH = (Get-Location).Path
            $v = & python -m porting.horizonport --version 2>&1 | Out-String -Stream
            $code = $LASTEXITCODE
            $v | ForEach-Object { Write-Host "  $_" }
            if ($code -ne 0) {
              Write-Host "::error::the toolkit in the shipped zip does not run (exit $code)"
              exit 1
            }
            # doctor's exit code is 0 unless a check FAILs; a missing Java is a WARN.
            & python -m porting.horizonport doctor | Out-String -Stream | ForEach-Object { Write-Host "  $_" }
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::the shipped toolkit's doctor reported a failure"
              exit 1
            }
          } finally { Pop-Location }
          Get-ChildItem out | Format-Table Name, Length

      - name: Verify the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # JL reports its own version and the updater compares release tags
          # against it. If the two disagree the updater either offers the build
          # that is already running, or refuses a genuinely newer one. The
          # version in CMakeLists.txt drifted once already (0.0.11 while tags
          # were at v0.2.x), which is what this step exists to prevent.
          $reported = (Select-String -Path "CMakeLists.txt" -Pattern '^set\(Launcher_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)\)').Matches |
                       ForEach-Object { $_.Groups[2].Value }
          $built = $reported -join "."
          $tag = "${{ github.ref_name }}"
          if ($tag.StartsWith("v")) { $tag = $tag.Substring(1) }
          Write-Host "tag: $tag   reported: $built"
          if ($built -ne $tag) {
            Write-Host "::error::the build reports $built but the tag is $tag; bump Launcher_VERSION_* in CMakeLists.txt"
            exit 1
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: JL-Windows-x64
          path: |
            out/JL-Windows-x64.zip
            out/JL.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        # v3 only moves the runtime to Node 24; inputs are unchanged from v2.
        # Staying on v2 makes GitHub force it onto Node 24 anyway, with a
        # deprecation warning on every release.
        uses: softprops/action-gh-release@v3
        with:
          name: JL ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # The standalone exe is the file most people want; the zip is the
          # complete portable install (Qt DLLs + plugins included).
          files: |
            out/JL.exe
            out/JL-Windows-x64.zip
