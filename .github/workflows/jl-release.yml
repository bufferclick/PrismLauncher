name: Build JL for Windows

# Builds JL.exe on a real Windows runner and attaches it to a GitHub Release.
#
# Triggers:
#   * push a tag like v0.0.1            -> builds and publishes a release
#   * "Run workflow" from the Actions   -> builds a portable zip artifact only
#
# No secrets or signing certificates are required: the portable build is a plain
# zip of the install tree, produced by tools/jlac/package-portable.ps1.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jl-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      BUILD_TYPE: Release
      CMAKE_PRESET: ci
      BUILD_PLATFORM: official
      ARTIFACT_NAME: Windows-MSVC

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.11.2

      - name: Cache vcpkg
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/cmake/vcpkg/installed
          key: jl-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: jl-vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset "$env:CMAKE_PRESET" -D VCPKG_HOST_TRIPLET=x64-windows -D VCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset "$env:CMAKE_PRESET" --config Release 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Show build errors
        if: failure()
        shell: pwsh
        run: |
          $lines = Get-Content build.log -ErrorAction SilentlyContinue
          if (-not $lines) { Write-Host "::error::build.log missing"; exit 0 }
          $idx = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match "error C|error LNK|FAILED:" }
          $n = 0
          foreach ($i in ($idx | Select-Object -First 8)) {
            $chunk = ($lines[$i..([Math]::Min($i + 2, $lines.Count - 1))] -join " / ")
            if ($chunk.Length -gt 900) { $chunk = $chunk.Substring(0, 900) }
            Write-Host "::error::$chunk"
            $n++
          }
          if ($n -eq 0) {
            $tail = ($lines | Select-Object -Last 12) -join " / "
            if ($tail.Length -gt 900) { $tail = $tail.Substring(0, 900) }
            Write-Host "::error::no compiler error found; tail: $tail"
          }

      - name: Verify the HorizonPort toolkit
        shell: pwsh
        run: |
          # The toolkit is what JL calls for every security-sensitive step:
          # verifying Horizon's signed checksums, unpacking a build, downloading
          # the owner's game files, preparing resources, validating a launch
          # command. If it is broken, the port is broken, so prove it on the
          # platform JL ships on.
          python -m porting.horizonport --version
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the toolkit does not run"; exit 1 }
          python -m porting.horizonport doctor
          # doctor exits non-zero only on FAIL; a missing Java or Rust is a WARN
          # and is expected on a build machine.
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::horizonport doctor reported a failure"; exit 1 }
          python -m unittest porting.tests.test_horizonport_sign porting.tests.test_horizonport_config `
                             porting.tests.test_horizonport_fetch porting.tests.test_horizonport_mods `
                             porting.tests.test_horizonport_launch porting.tests.test_horizonport_cli
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the toolkit's self-tests failed"; exit 1 }

      - name: Collect portable build
        shell: pwsh
        run: pwsh -NoProfile -File tools/jlac/package-portable.ps1

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "out/JL.exe")) { Write-Host "::error::JL.exe missing"; exit 1 }
          if (-not (Test-Path "out/JL-Windows-x64.zip")) { Write-Host "::error::portable zip missing"; exit 1 }
          # A shipped JL without the toolkit cannot install or play Horizon.
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "out/JL-Windows-x64.zip"))
          try {
            $toolkit = $zip.Entries | Where-Object { $_.FullName -like "*porting/horizonport/cli.py" }
            if (-not $toolkit) { Write-Host "::error::the portable zip does not contain porting/horizonport"; exit 1 }
            Write-Host "toolkit entries: $($zip.Entries.Count)"
          } finally { $zip.Dispose() }
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: JL-Windows-x64
          path: |
            out/JL-Windows-x64.zip
            out/JL.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: JL ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # The standalone exe is the file most people want; the zip is the
          # complete portable install (Qt DLLs + plugins included).
          files: |
            out/JL.exe
            out/JL-Windows-x64.zip
